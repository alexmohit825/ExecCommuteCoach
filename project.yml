name: ExecCommuteCoach
options:
  bundleIdPrefix: com.alexmohit825
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  ExecCommuteCoach:
    type: application
    platform: iOS
    sources:
      - path: Sources/VocalisApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: ExecCommuteCoach
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmohit825.ExecCommuteCoach
        INFOPLIST_FILE: Sources/VocalisApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        DEVELOPMENT_TEAM: 523MJL63MC
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "ExecCommuteCoach AppStore CI"
schemes:
  ExecCommuteCoach:
    build:
      targets:
        ExecCommuteCoach: all
    archive:
      config: Release
