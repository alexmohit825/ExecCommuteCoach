name: ExecCommuteCoach Ad-Hoc Direct OTA Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-export:
    name: 🍏 Compile, Sign & Stage Ad-Hoc OTA IPA
    runs-on: macos-15
    timeout-minutes: 25

    env:
      ASC_KEY_ID: 38F6WA87DU
      ASC_ISSUER_ID: 73c7355a-beef-4d79-919d-c3d7dec7747a
      ARCHIVE_PATH: build/ExecCommuteCoach.xcarchive
      EXPORT_PATH: build/export

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode (SDK required for compilation)
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Configure Ad-Hoc Profile & Dynamic Build Number
        run: |
          brew install xcodegen
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER: "ExecCommuteCoach AppStore CI"/PROVISIONING_PROFILE_SPECIFIER: "ExecCommuteCoach AdHoc Direct"/' project.yml
          sed -i '' 's/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: "${{ github.run_number }}"/' project.yml
          xcodegen generate
          ls -la

      - name: Install signing certificate and Ad-Hoc provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_ADHOC_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_ADHOC_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/dist.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_ADHOC_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/

      - name: Archive
        run: |
          xcodebuild archive \
            -project ExecCommuteCoach.xcodeproj \
            -scheme ExecCommuteCoach \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            > archive.log 2>&1 || { echo "::group::errors"; grep -E "error:|error -" archive.log | head -60; echo "::endgroup::"; tail -60 archive.log; exit 1; }
          tail -5 archive.log

      - name: Assert Embedded CarPlay Entitlements (Anti-Leap 7)
        run: |
          codesign -d --entitlements :- "$ARCHIVE_PATH/Products/Applications/ExecCommuteCoach.app" | tee archive_entitlements.xml
          grep -q "com.apple.developer.carplay-audio" archive_entitlements.xml || { echo "❌ Missing carplay-audio entitlement in compiled binary!"; exit 1; }
          grep -q "com.apple.developer.carplay-voice-based-conversation" archive_entitlements.xml || { echo "❌ Missing carplay-voice-based-conversation entitlement in compiled binary!"; exit 1; }
          echo "✅ CarPlay Audio and Voice-Based Conversation successfully embedded in binary!"

      - name: Export Ad-Hoc IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ExportOptions-AdHoc.plist
          ls -la "$EXPORT_PATH"

      - name: Upload Ad-Hoc IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExecCommuteCoach-AdHoc-IPA
          path: build/export/*.ipa
          retention-days: 30

      - name: Stage IPA to Cloudflare Worker OTA Installer (Pathway B)
        run: |
          IPA=$(ls "$EXPORT_PATH"/*.ipa | head -1)
          echo "Staging $IPA to vocalis-coach Cloudflare Worker..."
          curl -f -sS -X POST "https://vocalis-coach.mohalex.workers.dev/api/upload-ipa" \
            -H "Authorization: Bearer exec-commute-coach-secure-deploy-2026" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$IPA"
          echo "✅ Staged ExecCommuteCoach.ipa to live OTA installer endpoint!"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
