name: TestFlight CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      ASC_KEY_ID: 38F6WA87DU
      ASC_ISSUER_ID: 73c7355a-beef-4d79-919d-c3d7dec7747a
      ARCHIVE_PATH: build/ExecCommuteCoach.xcarchive
      EXPORT_PATH: build/export
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK required by App Store Connect)
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || { echo "No Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate
          ls -la

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/dist.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
          # Xcode 16 also reads profiles from this location
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          head -1 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive
        run: |
          xcodebuild archive \
            -project ExecCommuteCoach.xcodeproj \
            -scheme ExecCommuteCoach \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            > archive.log 2>&1 || { echo "::group::errors"; grep -E "error:|error -" archive.log | head -60; echo "::endgroup::"; tail -60 archive.log; exit 1; }
          tail -5 archive.log

      - name: Assert Embedded CarPlay Entitlements (Anti-Leap 7)
        run: |
          codesign -d --entitlements :- "$ARCHIVE_PATH/Products/Applications/ExecCommuteCoach.app" | tee archive_entitlements.xml
          grep -q "com.apple.developer.carplay-audio" archive_entitlements.xml || { echo "❌ Missing carplay-audio entitlement in compiled binary!"; exit 1; }
          grep -q "com.apple.developer.carplay-voice-based-conversation" archive_entitlements.xml || { echo "❌ Missing carplay-voice-based-conversation entitlement in compiled binary!"; exit 1; }
          echo "✅ CarPlay Audio and Voice-Based Conversation successfully embedded in binary!"

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ExportOptions.plist
          ls -la "$EXPORT_PATH"

      - name: Validate IPA (altool)
        run: |
          IPA=$(ls "$EXPORT_PATH"/*.ipa | head -1)
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload to TestFlight (altool)
        run: |
          IPA=$(ls "$EXPORT_PATH"/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
